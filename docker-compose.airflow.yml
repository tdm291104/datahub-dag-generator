services:
  airflow:
    image: apache/airflow:3.3.0
    command: standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8081}:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - airflow-state:/opt/airflow
      - ./output:/opt/airflow/dags:ro
      - ./data/static-assets/datasets/nyc-taxi:/opt/airflow/demo-data:ro

volumes:
  airflow-state:
